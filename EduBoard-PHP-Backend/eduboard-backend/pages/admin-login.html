<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login — EduBoard</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg:#0a0c10;--surface:#12151c;--card:#1a1e28;--border:#252a38;--accent:#e8486a;--text:#e8eaf0;--muted:#8891a8; }
    body { background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center; }
    body::before { content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(232,72,106,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(232,72,106,0.04) 1px,transparent 1px);background-size:50px 50px;pointer-events:none; }
    .blob { position:fixed;border-radius:50%;filter:blur(100px);opacity:0.12;pointer-events:none; }
    .blob-1 { width:500px;height:500px;background:var(--accent);top:-200px;right:-100px; }
    .blob-2 { width:300px;height:300px;background:#f5a623;bottom:-100px;left:-100px; }
    .login-wrap { position:relative;z-index:1;width:100%;max-width:440px;padding:20px; }
    .back-link { display:inline-flex;align-items:center;gap:8px;color:var(--muted);text-decoration:none;font-size:0.85rem;margin-bottom:32px;transition:color 0.2s; }
    .back-link:hover { color:var(--text); }
    .login-card { background:var(--card);border:1px solid var(--border);border-radius:24px;padding:48px 40px;animation:fadeUp 0.5s ease both; }
    .login-badge { display:inline-flex;align-items:center;gap:8px;background:rgba(232,72,106,0.1);border:1px solid rgba(232,72,106,0.3);border-radius:100px;padding:6px 14px;font-size:0.78rem;color:var(--accent);font-weight:500;margin-bottom:24px; }
    h1 { font-family:'Syne',sans-serif;font-size:2rem;font-weight:800;margin-bottom:8px; }
    .subtitle { color:var(--muted);font-size:0.9rem;margin-bottom:36px;line-height:1.5; }
    .form-group { margin-bottom:20px; }
    label { display:block;font-size:0.85rem;font-weight:500;margin-bottom:8px; }
    input { width:100%;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:0.95rem;outline:none;transition:border-color 0.2s,box-shadow 0.2s; }
    input:focus { border-color:var(--accent);box-shadow:0 0 0 3px rgba(232,72,106,0.1); }
    .input-hint { font-size:0.78rem;color:var(--muted);margin-top:6px; }
    .btn-login { width:100%;padding:15px;background:var(--accent);color:#fff;border:none;border-radius:12px;font-family:'Syne',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;margin-top:8px;transition:opacity 0.2s,transform 0.2s;display:flex;align-items:center;justify-content:center;gap:10px; }
    .btn-login:hover { opacity:0.9;transform:translateY(-1px); }
    .btn-login:disabled { opacity:0.6;cursor:not-allowed;transform:none; }
    .spinner { width:18px;height:18px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite;display:none; }
    .btn-login.loading .spinner { display:block; }
    .btn-login.loading .btn-text { opacity:0.7; }
    .error-msg { background:rgba(232,72,106,0.1);border:1px solid rgba(232,72,106,0.3);border-radius:10px;padding:12px 16px;color:#f08090;font-size:0.88rem;display:none;margin-bottom:16px; }
    .error-msg.show { display:block; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)} }
    @keyframes spin { to{transform:rotate(360deg)} }
    @media (max-width:480px) { .login-card{padding:32px 24px;} }
  </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="login-wrap">
    <a href="../index.html" class="back-link">← Back to Home</a>
    <div class="login-card">
      <div class="login-badge">🛡️ Admin Portal</div>
      <h1>Welcome Back</h1>
      <p class="subtitle">Sign in to manage notices, departments, and system settings.</p>
      <div class="error-msg" id="errorMsg"></div>
      <div class="form-group">
        <label>Admin Email</label>
        <input type="email" id="email" placeholder="admin@college.edu" autocomplete="email"/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password"/>
        <div class="input-hint">Default: admin@college.edu / admin123</div>
      </div>
      <button class="btn-login" id="loginBtn" onclick="handleLogin()">
        <div class="spinner"></div>
        <span class="btn-text">Sign In as Admin</span>
      </button>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script>
    async function handleLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const err = document.getElementById('errorMsg');
      const btn = document.getElementById('loginBtn');

      err.classList.remove('show');
      if (!email || !password) { err.textContent = 'Please enter email and password.'; err.classList.add('show'); return; }

      btn.classList.add('loading');
      btn.disabled = true;

      const result = await api.login(email, password);
      btn.classList.remove('loading');
      btn.disabled = false;

      if (result && result.success) {
        if (result.user.role !== 'admin') {
          err.textContent = 'Access denied. This portal is for admins only.';
          err.classList.add('show');
          await api.logout();
          return;
        }
        window.location.href = 'admin-dashboard.html';
      } else {
        err.textContent = result?.message || 'Login failed. Please try again.';
        err.classList.add('show');
      }
    }
    document.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });
  </script>
</body>
</html>
