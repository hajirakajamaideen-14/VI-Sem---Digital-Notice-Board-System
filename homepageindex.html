<!DOCTYPE html>
<html>
<head>
  <title>Digital Notice Board</title>
  <style>
    body {
      font-family: Arial;
      background-color: #f5f6fa;
      padding: 20px;
    }
    h1 {
      text-align: center;
    }
    .container {
      display: flex;
      gap: 20px;
      margin-top: 20px;
    }
    .card {
      background: white;
      padding: 15px;
      border-radius: 10px;
      width: 200px;
      box-shadow: 0px 0px 5px gray;
    }
    input {
      padding: 8px;
      width: 100%;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<h1>Digital Notice Board</h1>

<input type="text" placeholder="Search notices">

<div class="container">

  <div class="card">
    <h3>Exam Schedule</h3>
    <p>Date: April 10</p>
  </div>

  <div class="card">
    <h3>Holiday Notice</h3>
    <p>Date: April 15</p>
  </div>

  <div class="card">
    <h3>Event</h3>
    <p>College Fest</p>
  </div>

</div>

</body>
</html>
