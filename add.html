<!DOCTYPE html>
<html>
<head>
  <title>Add Notice</title>
</head>
<body>

<h2>Add Notice</h2>

<input type="text" id="title" placeholder="Notice Title"><br><br>
<textarea id="desc" placeholder="Description"></textarea><br><br>

<button onclick="addNotice()">Submit</button>
<button onclick="back()">Back</button>

<script>
function addNotice() {
  var title = document.getElementById("title").value;
  var desc = document.getElementById("desc").value;

  if(title === "" || desc === "") {
    alert("Fill all fields");
    return;
  }

  var notices = JSON.parse(localStorage.getItem("notices")) || [];
  notices.push({title: title, desc: desc});

  localStorage.setItem("notices", JSON.stringify(notices));

  alert("Notice Added!");
  window.location.href = "view.html";
}

function back() {
  window.location.href = "index.html";
}
</script>

</body>
</html>
