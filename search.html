<!DOCTYPE html>
<html>
<head>
  <title>Search</title>
</head>
<body>

<h2>Search Notices</h2>

<input type="text" id="searchBox" placeholder="Search..." onkeyup="searchNotice()">

<div id="results"></div>

<button onclick="back()">Back</button>

<script>
function searchNotice() {
  var input = document.getElementById("searchBox").value.toLowerCase();
  var notices = JSON.parse(localStorage.getItem("notices")) || [];
  var output = "";

  notices.forEach(function(n) {
    if(n.title.toLowerCase().includes(input)) {
      output += "<p><b>" + n.title + "</b>: " + n.desc + "</p>";
    }
  });

  document.getElementById("results").innerHTML = output;
}

function back() {
  window.location.href = "index.html";
}
</script>

</body>
</html>
